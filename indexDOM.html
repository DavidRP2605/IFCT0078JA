<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicios DOM</title>
    <link href="./src/assets/styles/custom.v2.0.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>Manipulando el DOM</h1>
    </header>

    <main>
      <section id="seccionParrafos">
        <h2>La sección de los párrafos</h2>
        <p id="parrafoPrincipal">Este es un párrafo de ejemplo.</p>
        <p id="parrafoSecundario">El contador va por:</p>
      </section>
      <section id="seccionBotones">
        <h2>La sección de los botones</h2>
        <button id="botonCambiarTexto">Cambiar Texto del Párrafo</button>
        <button id="botonAgregarElemento">Agregar Elemento a Lista</button>
        <button id="botonCambiarEstilo">Cambiar Estilo</button>
      </section>
      <section id="seccionListas">
        <h2>La sección de las listas</h2>
        <ul id="miLista">
          <li>Elemento inicial 1</li>
          <li>Elemento inicial 2</li>
        </ul>
      </section>
      <section id="seccionImagenes">
        <h2>La sección de las imágenes</h2>
        <div id="contenedorImagen">
          <!-- Aquí se agregará una imagen -->
        </div>
      </section>
      <section id="seccionFormulario">
        <h2>La sección del Formulario</h2>
        <form
          id="elFormulario"
          action="#"
          method="get"
          enctype="multipart/form-data"
        >
          <table>
            <tr id="filaNombre">
              <td><label for="campoNombre">Nombre:</label></td>
              <td>
                <input
                  type="text"
                  id="campoNombre"
                  name="nombre"
                  placeholder="Escribe tu nombre"
                />
              </td>
            </tr>

            <tr id="filaApellidos">
              <td><label for="campoApellidos">Apellidos:</label></td>
              <td>
                <input
                  type="text"
                  id="campoApellidos"
                  name="apellidos"
                  placeholder="Escribe tus apellidos"
                />
              </td>
            </tr>

            <tr id="filaEdad">
              <td><label for="campoFecha">Fecha de nacimiento:</label></td>
              <td><input type="date" id="campoFecha" name="fecha" /></td>
            </tr>

            <tr id="filaEmail">
              <td><label for="campoEmail">Correo electrónico:</label></td>
              <td>
                <input
                  type="text"
                  id="campoEmail"
                  name="email"
                  placeholder="Escribe tu correo electrónico"
                />
              </td>
            </tr>

            <tr id="filaProvincia">
              <td><label for="campoProvincia">Provincia:</label></td>
              <td>
                <select name="provincia" id="campoProvincia">
                  <option value="selecciona">Selecciona una opcion</option>
                  <option value="almeria">Almería</option>
                  <option value="cadiz">Cádiz</option>
                  <option value="cordoba">Córdoba</option>
                  <option value="granada">Granada</option>
                  <option value="huelva">Huelva</option>
                  <option value="jaen">Jaén</option>
                  <option value="malaga">Málaga</option>
                  <option value="sevilla">Sevilla</option>
                </select>
              </td>
            </tr>

            <tr id="filaGenero">
              <td><label for="campoGenero">Género:</label></td>
              <td>
                <input
                  type="radio"
                  id="generoHombre"
                  name="genero"
                  value="hombre"
                  checked
                />
                Hombre
                <input
                  type="radio"
                  id="generoMujer"
                  name="genero"
                  value="mujer"
                />
                Mujer
                <input
                  type="radio"
                  id="generoOtros"
                  name="genero"
                  value="otros"
                />
                Otros
                <input
                  type="radio"
                  id="generoNC"
                  name="genero"
                  value="noContestar"
                />
                Prefiero no contestar
              </td>
            </tr>

            <tr id="filaTecnologias">
              <td>
                <label for="campoTecnologias">Selecciona tecnologías:</label>
              </td>
              <td>
                <select
                  id="campoTecnologias"
                  name="tecnologias[]"
                  multiple
                  size="10"
                >
                  <optgroup label="Tecnologías Servidor">
                    <option value="php">PHP</option>
                    <option value="nodejs">Node.js</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="csharp">C#</option>
                  </optgroup>
                  <optgroup label="Tecnologías Cliente">
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="angular">Angular</option>
                    <option value="react">React</option>
                    <option value="bootstrap">Bootstrap</option>
                    <option value="jquery">jQuery</option>
                  </optgroup>
                </select>
              </td>
            </tr>

            <tr id="filaExperiencia">
              <td>
                <label for="campoExperiencia">Años de experiencia:</label>
              </td>
              <td>
                <input
                  type="number"
                  id="campoExperiencia"
                  name="experiencia"
                  min="0"
                  step="1"
                  placeholder="Ej: 3"
                />
              </td>
            </tr>

            <tr id="filaCv">
              <td><label for="campoCV">Añadir CV (Formato PDF):</label></td>
              <td>
                <input
                  type="file"
                  id="campoCV"
                  name="cv"
                  accept="application/pdf"
                />
              </td>
            </tr>

            <tr id="filaCheckbox">
              <td colspan="2">
                <input type="checkbox" id="checkPolitica" name="politica" />
                <label for="checkPolitica">
                  <a
                    href="https://www.aepd.es/politica-de-privacidad-y-aviso-legal"
                    target="_blank"
                    rel="noopener noreferrer"
                    >He leído y acepto la Política de Privacidad</a
                  > </label
                ><br />
                <input
                  type="checkbox"
                  id="checkCondiciones"
                  name="condiciones"
                />
                <label for="checkCondiciones" id="labelCondiciones">
                  <a
                    href="https://es.wikipedia.org/wiki/T%C3%A9rminos_y_condiciones_de_uso"
                    target="_blank"
                    rel="noopener noreferrer"
                    >Acepto las Condiciones de Uso</a
                  >
                </label>
              </td>
            </tr>

            <tr>
              <td colspan="2">
                <button id="botonGuardar" type="submit">Guardar</button>
              </td>
            </tr>
          </table>
        </form>
      </section>
    </main>
