<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicios DOM</title>
    <link href="./src/assets/styles/custom.v2.0.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>Manipulando el DOM</h1>
    </header>

    <main>
      <section id="seccionParrafos">
        <h2>La sección de los párrafos</h2>
        <p id="parrafoPrincipal">Este es un párrafo de ejemplo.</p>
        <p id="parrafoSecundario">El contador va por:</p>
      </section>
      <section id="seccionBotones">
        <h2>La sección de los botones</h2>
        <button id="botonCambiarTexto">Cambiar Texto del Párrafo</button>
        <button id="botonAgregarElemento">Agregar Elemento a Lista</button>
        <button id="botonCambiarEstilo">Cambiar Estilo</button>
      </section>
      <section id="seccionListas">
        <h2>La sección de las listas</h2>
        <ul id="miLista">
          <li>Elemento inicial 1</li>
          <li>Elemento inicial 2</li>
        </ul>
      </section>
      <section id="seccionImagenes">
        <h2>La sección de las imágenes</h2>
        <div id="contenedorImagen">
          <!-- Aquí se agregará una imagen -->
        </div>
      </section>
      <section id="seccionFormulario">
        <h2>La sección del Formulario</h2>
        <form
          id="elFormulario"
          action="#"

        >
          <label for="campoNombre">Nombre: </label>
          <input
            type="text"
            id="campoNombre"
            name="nombre"
            placeholder="Escribe tu nombre"
          /><br id="brNombre" /><br />

          <label for="campoApellidos">Apellidos: </label>
          <input
            type="text"
            id="campoApellidos"
            name="apellidos"
            placeholder="Escribe tus apellidos"
          /><br id="brApellidos" /><br />

          <label for="campoFecha">Fecha de nacimiento: </label>
          <input type="date" id="campoFecha" name="fecha" />
          <br id="brFecha1"/>
          <br/>

          <label for="campoEmail">Correo electrónico</label>
          <input
            type="text"
            id="campoEmail"
            name="email"
            placeholder="Escribe tu correo electrónico"
          /><br id="brEmail" /><br />

          <label for="campoProvincia">Provincia: </label>
          <select name="provincia" id="campoProvincia">
            <option value="selecciona">Selecciona una opcion</option>
            <option value="almeria">Almería</option>
            <option value="cadiz">Cádiz</option>
            <option value="cordoba">Córdoba</option>
            <option value="granada">Granada</option>
            <option value="huelva">Huelva</option>
            <option value="jaen">Jaén</option>
            <option value="malaga">Málaga</option>
            <option value="sevilla">Sevilla</option></select
          ><br id="brProvincia" /><br />

          <label for="campoGenero"
            >Género:
            <input
              type="radio"
              id="generoHombre"
              name="genero"
              value="hombre"
              checked
            />
            Hombre
            <input type="radio" id="generoMujer" name="genero" value="mujer" />
            Mujer
            <input type="radio" id="generoOtros" name="genero" value="otros" />
            Otros
            <input type="radio" id="generoNC" name="genero" value="noContestar" />
            Prefiero no contestar
          </label>
          <br id="brGenero" /><br />

          <label for="campoTecnologias">Selecciona tecnologías:</label><br />
          <select id="campoTecnologias" name="tecnologias[]" multiple size="10">
            <optgroup label="Tecnologías Servidor">
              <option value="php">PHP</option>
              <option value="nodejs">Node.js</option>
              <option value="python">Python</option>
              <option value="java">Java</option>
              <option value="csharp">C#</option>
            </optgroup>
            <optgroup label="Tecnologías Cliente">
              <option value="html">HTML</option>
              <option value="css">CSS</option>
              <option value="javascript">JavaScript</option>
              <option value="angular">Angular</option>
              <option value="react">React</option>
              <option value="bootstrap">Bootstrap</option>
              <option value="jquery">jQuery</option>
            </optgroup>
          </select>
          <br id="brTecnologias" /><br />

          <label for="campoExperiencia">Años de experiencia:</label>
          <input
            type="number"
            id="campoExperiencia"
            name="experiencia"
            min="0"
            step="1"
            placeholder="Ej: 3"
          />
          <br id="brExperiencia" /><br />

          <label for="campoCV">Añadir CV (Formato PDF):</label>
          <input type="file" id="campoCV" name="cv" accept="application/pdf" />
          <span id="fileName" class="text-sm text-gray-500"></span>
          <br id="brCv" /><br />

          <button id="botonGuardar" type="submit">Guardar</button>
        </form>
      </section>
    </main>
